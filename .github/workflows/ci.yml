name: Hello Bitcoin CI/CD

on:
  push:
    branches: ["main", "master", "copilot/**"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  deployments: write
  issues: write
  pull-requests: write

jobs:
  # ── 1. Build & Test ────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --if-present

      - name: Build (Hello Bitcoin)
        run: npm run build

      - name: Run tests
        run: npm test

  # ── 2. Deploy (only on push to main/master after tests pass) ──────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --if-present

      - name: Run Hello Bitcoin
        run: npm start

      - name: Deploy success notification
        run: |
          echo "🚀 Hello Bitcoin deployed successfully!"
          echo "Author  : kushmanmb"
          echo "GitHub  : https://github.com/Kushmanmb"
          echo "Facebook: https://www.facebook.com/Kushmanmb23"
          echo "X       : https://x.com/kushmanmb"
