# bitcoin.conf — Bitcoin Core configuration template
# Copy this file to ~/.bitcoin/bitcoin.conf and adjust as needed.
# Full reference: https://github.com/bitcoin/bitcoin/blob/master/share/examples/bitcoin.conf

# ── Network ──────────────────────────────────────────────────────────────────
# Use the main Bitcoin network (default).
# Set to 1 to use the public test network (testnet3) instead.
testnet=0

# ── Connections ──────────────────────────────────────────────────────────────
# Maximum number of inbound+outbound connections (default: 125).
maxconnections=40

# ── RPC server ───────────────────────────────────────────────────────────────
# Enable the JSON-RPC server so bitcoin-cli and applications can communicate
# with the node.
server=1

# RPC credentials — CHANGE THESE before running on a network-accessible host.
# Generate a strong password with:  openssl rand -hex 32
rpcuser=bitcoinrpc
rpcpassword=REPLACE_WITH_A_STRONG_RANDOM_PASSWORD

# Only allow RPC connections from localhost by default.
rpcallowip=127.0.0.1

# ── Transaction index ────────────────────────────────────────────────────────
# Build a full transaction index. Required by some block explorers / wallets.
# Set to 1 only if you need it — initial build takes extra time and disk space.
txindex=0

# ── Logging ──────────────────────────────────────────────────────────────────
# Print logs to stdout in addition to debug.log (useful for containers).
# printtoconsole=1

# ── Data directory ───────────────────────────────────────────────────────────
# Override the default data directory (~/.bitcoin) if needed.
# datadir=/mnt/bitcoin-data
